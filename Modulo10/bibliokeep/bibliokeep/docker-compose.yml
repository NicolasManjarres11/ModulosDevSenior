services:
  db:
    image: postgres:18-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: bibliokeep_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bibliokeep_db"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - bibliokeep-net


  backend:
    image: manjarres/bibliokeep-backend:latest
    container_name: backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: bibliokeep_db
      DB_USER: admin
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      APP_JWT_SECRET: ${JWT_SECRET:-my-secret-key-for-jwt-token-generation-and-validation-12345}
      APP_UPLOAD_DIRECTORY: /files
      APP_ALLOWED_ORIGINS: http://localhost
    ports:
      - "8080:8080"
    volumes:
      - ./archivos:/files
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/v3/api-docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 90s
    networks:
      - bibliokeep-net


  frontend:
    image: manjarres/bibliokeep-frontend:latest
    container_name: frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - bibliokeep-net


volumes:
  postgres_data:
    driver: local
networks:
  bibliokeep-net:
    driver: bridge

