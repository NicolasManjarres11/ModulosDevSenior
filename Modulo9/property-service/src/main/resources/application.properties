spring.application.name=property-service

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/propertydb
spring.datasource.username=postgres
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# SQL Initialization (solo para primera vez)
spring.sql.init.mode=never

# JWT Configuration
jwt.secret=miClaveSecretaSuperSeguraParaJWT2025DevSeniorNmanjaPropertyService
jwt.expiration=86400000
jwt.issuer=property-service
jwt.audience=property-service-users

# Server Configuration
server.port=8080
