<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
  <div class="max-w-md w-full space-y-8">
    <!-- Header -->
    <div class="text-center">
      <h1 class="text-4xl font-bold text-gray-900 mb-2">Bienvenido</h1>
      <p class="text-gray-600">Inicia sesión en tu cuenta</p>
    </div>

    <!-- Formulario de Login -->
    <div class="bg-white rounded-2xl shadow-xl p-8">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        
        <!-- Campo Usuario -->
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
            Usuario
          </label>
          <input
            id="username"
            type="text"
            formControlName="username"
            [class.border-red-500]="isFieldInvalid('username')"
            [class.border-gray-300]="!isFieldInvalid('username')"
            class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-colors"
            placeholder="Ingresa tu usuario"
            autocomplete="username"
          />
          <div *ngIf="isFieldInvalid('username')" class="mt-1 text-sm text-red-600">
            {{ getFieldError('username') }}
          </div>
        </div>

        <!-- Campo Contraseña -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
            Contraseña
          </label>
          <input
            id="password"
            type="password"
            formControlName="password"
            [class.border-red-500]="isFieldInvalid('password')"
            [class.border-gray-300]="!isFieldInvalid('password')"
            class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-colors"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
          />
          <div *ngIf="isFieldInvalid('password')" class="mt-1 text-sm text-red-600">
            {{ getFieldError('password') }}
          </div>
        </div>

        <!-- Mensaje de Error -->
        <div *ngIf="error()" class="bg-red-50 border border-red-200 rounded-lg p-4">
          <div class="flex">
            <div class="flex-shrink-0">
              <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
              </svg>
            </div>
            <div class="ml-3">
              <p class="text-sm text-red-800">{{ error() }}</p>
            </div>
          </div>
        </div>

        <!-- Botón de Login -->
        <button
          type="submit"
          [disabled]="loginForm.invalid || loading()"
          class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
        >
          <svg *ngIf="loading()" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          {{ loading() ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
        </button>

        <!-- Enlaces adicionales -->
        <div class="text-center space-y-3">
          <div>
            <a 
            (click)="goToRegister()"
              routerLink="/auth/register" 
              class="text-sm text-indigo-600 hover:text-indigo-500 font-medium transition-colors"
            >
              ¿No tienes cuenta? Regístrate
            </a>
          </div>
          <div>
            <button 
              type="button"
              (click)="goToHome()"
              class="text-sm text-gray-500 hover:text-gray-700 transition-colors"
            >
              Volver al inicio
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- Footer -->
    <div class="text-center text-sm text-gray-500">
      <p>&copy; 2025 RealStateFrontend. Todos los derechos reservados.</p>
    </div>
  </div>
</div>
